[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planejadocs-backend"
version = "0.1.0"
description = "Backend PlanejaDocs - Conversor PDF para Markdown"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pymupdf4llm>=1.28",
    "pdfplumber>=0.11",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "rapidocr>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Silencia deprecation de terceiro (surya/marker) — não é código nosso.
filterwarnings = ["ignore:.*class-based `config`.*:DeprecationWarning"]

[tool.ruff.lint]
# B008: File()/Form()/Depends() em defaults é o idioma padrão do FastAPI.
ignore = ["B008"]
