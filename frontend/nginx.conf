server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rotas desconhecidas caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mesmas rotas do proxy do vite dev (vite.config.js).
    location /convert { proxy_pass http://backend:8000; }
    location /health  { proxy_pass http://backend:8000; }
    location /themes  { proxy_pass http://backend:8000; }
    location /tables  { proxy_pass http://backend:8000; }

    # Uploads de PDF podem ser grandes (PDF2MD_MAX_FILE_SIZE_MB=50).
    client_max_body_size 60m;
}
